<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lawton Chapter · Demo by GoElev8.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#8C1C2E; --crimson-deep:#6E1422; --accent:#8C1C2E;
  --cream:#F2EADB; --bg:#FBF7F0; --surface:#FFFFFF; --ink:#231A1B; --muted:#6B5E5C; --line:#E3D8C8;
  --on-crimson:#FBF1E6; --shadow:0 1px 2px rgba(35,26,27,.06);
  --serif:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1314; --surface:#241B1C; --ink:#F2EADB; --muted:#BCAEA6; --line:#3B2F30; --accent:#E06A7D; --cream:#2C2122; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1314; --surface:#241B1C; --ink:#F2EADB; --muted:#BCAEA6; --line:#3B2F30; --accent:#E06A7D; --cream:#2C2122; --shadow:none;
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55}
img{max-width:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px}

/* demo bar */
.demobar{background:var(--ink); color:var(--bg); font-size:14px}
.demobar .wrap{display:flex; gap:12px; align-items:center; justify-content:space-between; padding-top:8px; padding-bottom:8px; flex-wrap:wrap}
.demobar button{background:transparent; border:1px solid currentColor; color:inherit; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px}

/* nav */
header.nav{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex; align-items:center; justify-content:space-between; height:68px; gap:16px}
.brand{font-family:var(--serif); font-size:24px; color:var(--ink); text-decoration:none; line-height:1.1}
.brand small{display:block; font-family:var(--sans); font-size:12px; color:var(--muted); letter-spacing:.02em}
.navlinks{display:flex; gap:20px; align-items:center}
.navlinks a{color:var(--ink); text-decoration:none; font-weight:500}
.navlinks a:hover{color:var(--accent)}
@media (max-width:720px){ .navlinks a.hide-sm{display:none} }

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; padding:11px 18px; font-weight:600; border:1px solid transparent; cursor:pointer; text-decoration:none; font-size:16px}
.btn-primary{background:var(--crimson); color:var(--on-crimson)}
.btn-primary:hover{background:var(--crimson-deep)}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-sm{padding:7px 12px; font-size:14px}
.btn-danger{background:transparent; color:var(--accent); border-color:var(--line)}

/* hero */
.hero{background:var(--crimson); color:var(--on-crimson); overflow:hidden}
.hero .wrap{display:grid; grid-template-columns:1.2fr .9fr; gap:48px; padding-top:72px; padding-bottom:72px; align-items:end}
.hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(44px,7vw,84px); line-height:1; margin:0 0 20px}
.hero p.lede{font-size:20px; max-width:34ch; margin:0 0 28px; color:#F3DCCB}
.hero .btn-light{background:var(--on-crimson); color:var(--crimson)}
.hero .btn-outline{border-color:rgba(251,241,230,.5); color:var(--on-crimson); background:transparent}
.nextcard{background:var(--on-crimson); color:#231A1B; border-radius:14px; padding:28px; display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:start}
.nextcard .kicker{grid-column:1/-1; font-size:14px; font-weight:600; color:#8C1C2E; margin:0}
.datebox{text-align:center; border-right:1px solid #E3D0BF; padding-right:22px}
.datebox .m{font-size:15px; font-weight:700; color:#8C1C2E}
.datebox .d{font-family:var(--serif); font-size:64px; line-height:.95}
.nextcard h2{font-family:var(--serif); font-weight:400; font-size:28px; line-height:1.15; margin:0 0 8px}
.nextcard .meta{color:#6B5E5C; font-size:15px; margin:0 0 14px}
@media (max-width:860px){ .hero .wrap{grid-template-columns:1fr; padding-top:48px; padding-bottom:48px} }

section.block{padding:72px 0; border-bottom:1px solid var(--line)}
h2.sec{font-family:var(--serif); font-weight:400; font-size:clamp(32px,4.5vw,46px); line-height:1.1; margin:0 0 8px}
p.sub{color:var(--muted); margin:0 0 32px; max-width:60ch}

/* events list */
.evlist{display:flex; flex-direction:column}
.ev{display:grid; grid-template-columns:96px 1fr auto; gap:24px; padding:22px 0; border-top:1px solid var(--line); align-items:center}
.ev:last-child{border-bottom:1px solid var(--line)}
.ev .when{font-weight:700; color:var(--accent); font-size:15px; line-height:1.3}
.ev .when b{display:block; font-family:var(--serif); font-weight:400; color:var(--ink); font-size:36px; line-height:1}
.ev h3{margin:0 0 4px; font-size:20px}
.ev p{margin:0; color:var(--muted); font-size:15px}
.tag{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--cream); color:var(--ink); margin-left:8px; vertical-align:middle}
@media (max-width:640px){ .ev{grid-template-columns:72px 1fr} .ev .act{grid-column:2} }

/* about */
.about{display:grid; grid-template-columns:1fr 1fr; gap:48px}
.about p{margin:0 0 16px}
.officers{display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line)}
.officer{padding:16px 0; border-bottom:1px solid var(--line)}
.officer .role{font-size:14px; color:var(--muted)}
.officer .nm{font-weight:600}
@media (max-width:760px){ .about{grid-template-columns:1fr} }

.gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.ph{aspect-ratio:4/3; border-radius:10px; background:repeating-linear-gradient(135deg,var(--cream) 0 14px,var(--surface) 14px 28px); border:1px solid var(--line); display:flex; align-items:flex-end; padding:12px; font-size:14px; color:var(--muted)}
@media (max-width:640px){ .gallery{grid-template-columns:1fr 1fr} }

form.stack{display:flex; flex-direction:column; gap:14px; max-width:560px}
label{font-weight:600; font-size:14px; display:flex; flex-direction:column; gap:6px}
input,select,textarea{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-weight:400; font-size:16px}
textarea{min-height:110px; resize:vertical}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:560px){ .row2{grid-template-columns:1fr} }

footer.foot{padding:40px 0 56px; color:var(--muted); font-size:14px}
footer.foot .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

/* app shell for portal/admin */
.shell{padding:40px 0 72px}
.shell h1{font-family:var(--serif); font-weight:400; font-size:clamp(34px,5vw,52px); margin:0 0 6px; line-height:1.1}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:28px 0 28px; overflow-x:auto}
.tabs button{background:none; border:none; padding:12px 16px; cursor:pointer; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--crimson)}
.folders{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.folder{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:left; cursor:pointer; box-shadow:var(--shadow)}
.folder:hover{border-color:var(--accent)}
.folder .ic{width:40px; height:32px; background:var(--crimson); border-radius:4px 10px 4px 4px; margin-bottom:14px; position:relative}
.folder .ic::before{content:""; position:absolute; left:0; top:-6px; width:18px; height:8px; background:var(--crimson); border-radius:4px 4px 0 0}
.folder h3{margin:0 0 2px; font-size:17px}
.folder p{margin:0; font-size:14px; color:var(--muted)}
.files{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.file{display:flex; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center}
.file:last-child{border-bottom:none}
.file span{color:var(--muted); font-size:14px; white-space:nowrap}
.note{background:var(--cream); border-radius:10px; padding:14px 18px; font-size:15px; margin-bottom:24px}
.tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px}
table.data{width:100%; border-collapse:collapse; font-size:15px; min-width:640px}
table.data th{text-align:left; font-size:13px; color:var(--muted); font-weight:600; padding:12px 16px; border-bottom:1px solid var(--line)}
table.data td{padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
.actions{display:flex; gap:8px; justify-content:flex-end}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.status{font-size:13px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--cream)}
.status.pending{background:#F6E3B8; color:#5A3F00}
.status.inactive{background:var(--line); color:var(--muted)}
.empty{padding:40px; text-align:center; color:var(--muted)}

/* modal + toast */
.overlay{position:fixed; inset:0; background:rgba(20,12,13,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
.overlay.open{display:flex}
.modal{background:var(--bg); border-radius:14px; width:100%; max-width:520px; max-height:calc(100% - 40px); overflow:auto; padding:28px}
.modal h2{font-family:var(--serif); font-weight:400; font-size:30px; margin:0 0 6px}
.modal .x{float:right; background:none; border:none; font-size:26px; cursor:pointer; color:var(--muted); line-height:1}
.quick{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px}
.err{color:var(--accent); font-size:14px; min-height:20px; margin:0}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:10px; font-size:15px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="demobar"><div class="wrap">
  <span>Interactive demo with sample data · built by GoElev8.ai</span>
  <button id="resetBtn" type="button">Reset demo</button>
</div></div>
<header class="nav"><div class="wrap">
  <a class="brand" href="#" data-go="home" id="brand"></a>
  <nav class="navlinks" id="navlinks"></nav>
</div></header>
<main id="app"></main>
<footer class="foot"><div class="wrap">
  <span id="footName"></span>
  <span>Site by <a href="https://goelev8.ai" target="_blank" rel="noopener">GoElev8.ai</a></span>
</div></footer>

<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='lawton-demo-v2';
const today=new Date(); today.setHours(0,0,0,0);
function iso(offsetDays){const d=new Date(today); d.setDate(d.getDate()+offsetDays); return d.toISOString().slice(0,10);}

function seed(){return{
  chapterName:'Lawton Chapter',
  fraternity:'Kappa Alpha Psi Fraternity, Inc.',
  tagline:'Brothers serving Lawton and Fort Sill through mentorship, scholarship, and service.',
  about:'Our chapter brings together men committed to achievement in every field of human endeavor. We mentor young men through Guide Right and Kappa League, award scholarships to local students, and partner with neighbors across Comanche County on service projects throughout the year.',
  officers:[['Polemarch','[Name]'],['Vice Polemarch','[Name]'],['Keeper of Records','[Name]'],['Keeper of Exchequer','[Name]'],['Strategus','[Name]'],['Lieutenant Strategus','[Name]']],
  driveProvider:'Google Drive',
  events:[
    {id:1,title:'Chapter business meeting',date:iso(9),time:'19:00',location:'Chapter meeting hall',desc:'Monthly business meeting. Agenda posted in Meeting Minutes.',vis:'members',link:''},
    {id:2,title:'Scholarship info night',date:iso(16),time:'18:30',location:'Lawton Public Library',desc:'Local high school seniors and parents learn how to apply for this year\u2019s chapter scholarships.',vis:'public',link:'#'},
    {id:3,title:'Guide Right mentoring Saturday',date:iso(25),time:'10:00',location:'Community center',desc:'Workshops on goal-setting, financial basics, and college prep for young men ages 12\u201318.',vis:'public',link:'#'},
    {id:4,title:'Fall community food drive',date:iso(46),time:'09:00',location:'Central Plaza parking lot',desc:'Drop off canned goods and non-perishables. Volunteers welcome.',vis:'public',link:'#'}
  ],
  brotherPw:'kappa1911',
  officerPw:'officer1911',
  role:null
};}

let S;
try{const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):seed();}catch(e){S=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let view=S.role?'portal':'home', tab='docs', openFolder=null;

const FOLDERS=[
  {name:'Meeting Minutes',desc:'Agendas and approved minutes',files:['Minutes \u2013 last month.pdf','Agenda \u2013 next meeting.docx','Minutes \u2013 two months ago.pdf']},
  {name:'Bylaws & Policies',desc:'Chapter bylaws and standing rules',files:['Chapter bylaws.pdf','Standing rules.pdf','Risk management checklist.pdf']},
  {name:'Forms',desc:'Reimbursement, event, and volunteer forms',files:['Reimbursement request.docx','Event request form.docx','Volunteer sign-up sheet.xlsx']},
  {name:'Finance',desc:'Budgets and dues records',files:['Annual budget.xlsx','Dues tracker.xlsx']},
  {name:'Programs',desc:'Guide Right, Kappa League, scholarships',files:['Guide Right curriculum.pdf','Scholarship application.docx','Kappa League calendar.xlsx']}
];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dt(e){return new Date(e.date+'T'+(e.time||'00:00'));}
function fmtDate(e){return dt(e).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtTime(e){return e.time?dt(e).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'';}
function upcoming(includeMembers){return S.events.filter(e=>new Date(e.date+'T00:00')>=today&&(includeMembers||e.vis==='public')).sort((a,b)=>dt(a)-dt(b));}
function toast(msg){const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400);}

function renderChrome(){
  $('#brand').innerHTML=esc(S.chapterName)+'<small>'+esc(S.fraternity)+'</small>';
  $('#footName').textContent='\u00a9 2026 '+S.chapterName+', '+S.fraternity;
  let h='';
  if(view==='home'){h+='<a class="hide-sm" href="#events">Events</a><a class="hide-sm" href="#about">About</a><a class="hide-sm" href="#contact">Contact</a>';}
  else{h+='<a href="#" data-go="home">Public site</a>';}
  if(S.role){
    if(view!=='portal')h+='<a href="#" data-go="portal">Brothers portal</a>';
    if(S.role==='admin'&&view!=='admin')h+='<a href="#" data-go="admin">Officer dashboard</a>';
    h+='<button class="btn btn-ghost btn-sm" data-act="logout">Sign out</button>';
  }else h+='<button class="btn btn-primary btn-sm" data-act="login">Brothers</button>';
  $('#navlinks').innerHTML=h;
}

function evRow(e,showVis){
  const d=dt(e);
  return `<div class="ev"><div class="when">${d.toLocaleDateString(undefined,{month:'short'})}<b>${d.getDate()}</b></div>
  <div><h3>${esc(e.title)}${showVis&&e.vis==='members'?'<span class="tag">Brothers only</span>':''}</h3>
  <p>${esc(fmtDate(e))}${e.time?' at '+esc(fmtTime(e)):''} \u00b7 ${esc(e.location)}</p>
  ${e.desc?`<p style="margin-top:6px">${esc(e.desc)}</p>`:''}</div>
  <div class="act">${e.link?`<button class="btn btn-ghost btn-sm" data-act="rsvp" data-id="${e.id}">RSVP</button>`:''}</div></div>`;
}

function renderHome(){
  const ev=upcoming(false), next=ev[0];
  const nextHtml=next?`<div class="nextcard"><p class="kicker">Next event</p>
    <div class="datebox"><div class="m">${dt(next).toLocaleDateString(undefined,{month:'short'})}</div><div class="d">${dt(next).getDate()}</div></div>
    <div><h2>${esc(next.title)}</h2><p class="meta">${esc(fmtTime(next))} \u00b7 ${esc(next.location)}</p>
    ${next.link?`<button class="btn btn-primary btn-sm" data-act="rsvp" data-id="${next.id}">RSVP</button>`:''}</div></div>`
    :`<div class="nextcard"><p class="kicker">Next event</p><div style="grid-column:1/-1">New events are posted here as soon as officers add them.</div></div>`;
  $('#app').innerHTML=`
  <section class="hero"><div class="wrap">
    <div><h1>${esc(S.chapterName)}</h1><p class="lede">${esc(S.tagline)}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-light" href="#events">See upcoming events</a><button class="btn btn-outline" data-act="login">Brothers</button></div></div>
    ${nextHtml}
  </div></section>
  <section class="block" id="events"><div class="wrap">
    <h2 class="sec">Upcoming events</h2><p class="sub">Open to the community unless noted. Updated by chapter officers.</p>
    <div class="evlist">${ev.length?ev.map(e=>evRow(e,false)).join(''):'<div class="empty">No public events scheduled yet.</div>'}</div>
  </div></section>
  <section class="block" id="about"><div class="wrap about">
    <div><h2 class="sec">About the chapter</h2><p>${esc(S.about)}</p></div>
    <div><h3 style="margin:8px 0 12px">Chapter leadership</h3><div class="officers">${S.officers.map(o=>`<div class="officer"><div class="role">${esc(o[0])}</div><div class="nm">${esc(o[1])}</div></div>`).join('')}</div></div>
  </div></section>
  <section class="block"><div class="wrap">
    <h2 class="sec">In the community</h2><p class="sub">Chapter photos from service projects, mentoring, and events go here.</p>
    <div class="gallery">${['Guide Right','Scholarship night','Food drive','Kappa League','Founders\u2019 Day','Community service'].map(c=>`<div class="ph">${c}</div>`).join('')}</div>
  </div></section>
  <section class="block" id="contact"><div class="wrap">
    <h2 class="sec">Contact the chapter</h2><p class="sub">Questions about events, partnerships, or scholarships? Send a note and an officer will reply.</p>
    <form class="stack" id="contactForm"><div class="row2"><label>Name<input required name="n"></label><label>Email<input type="email" required name="e"></label></div>
    <label>Message<textarea required name="m"></textarea></label><div><button class="btn btn-primary" type="submit">Send message</button></div></form>
  </div></section>`;
  $('#contactForm').addEventListener('submit',ev=>{ev.preventDefault(); ev.target.reset(); toast('Message sent. An officer will follow up.');});
}

function renderPortal(){
  if(!S.role){view='home'; return render();}
  const ev=upcoming(true);
  let body='';
  if(tab==='docs'){
    if(openFolder!==null){const f=FOLDERS[openFolder];
      body=`<button class="btn btn-ghost btn-sm" data-act="back" style="margin-bottom:16px">Back to folders</button>
      <h2 class="sec" style="font-size:32px">${esc(f.name)}</h2><p class="sub">Stored in the chapter\u2019s ${esc(S.driveProvider)}.</p>
      <div class="files">${f.files.map(n=>`<div class="file"><strong>${esc(n)}</strong><button class="btn btn-ghost btn-sm" data-act="openfile">Open in ${esc(S.driveProvider)}</button></div>`).join('')}</div>`;
    }else{
      body=`<div class="note">Documents live in the chapter\u2019s ${esc(S.driveProvider)}. Your access is managed by chapter officers.</div>
      <div class="folders">${FOLDERS.map((f,i)=>`<button class="folder" data-act="folder" data-i="${i}"><div class="ic"></div><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p></button>`).join('')}</div>`;
    }
  }else{
    body=`<div class="evlist">${ev.length?ev.map(e=>evRow(e,true)).join(''):'<div class="empty">No events scheduled.</div>'}</div>`;
  }
  $('#app').innerHTML=`<div class="wrap shell"><h1>Welcome, Brother</h1><p class="sub" style="margin:0">Brothers portal \u00b7 ${esc(S.chapterName)}</p>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='docs'}" data-tab="docs">Chapter documents</button><button role="tab" aria-selected="${tab==='events'}" data-tab="events">Chapter calendar</button></div>${body}</div>`;
}

function renderAdmin(){
  if(S.role!=='admin'){view='home'; return render();}
  let body='';
  if(tab==='aevents'){
    const all=[...S.events].sort((a,b)=>dt(a)-dt(b));
    body=`<div class="toolbar"><p class="sub" style="margin:0">Events you add here appear on the public site or the brothers portal right away.</p><button class="btn btn-primary" data-act="newevent">Add event</button></div>
    <div class="tablewrap"><table class="data"><tr><th>Event</th><th>Date</th><th>Shown to</th><th></th></tr>
    ${all.length?all.map(e=>`<tr><td><strong>${esc(e.title)}</strong><br><span style="color:var(--muted);font-size:14px">${esc(e.location)}</span></td><td>${esc(fmtDate(e))}${e.time?'<br><span style="color:var(--muted);font-size:14px">'+esc(fmtTime(e))+'</span>':''}</td><td>${e.vis==='public'?'Everyone':'Brothers only'}</td>
    <td><div class="actions"><button class="btn btn-ghost btn-sm" data-act="editevent" data-id="${e.id}">Edit</button><button class="btn btn-danger btn-sm" data-act="delevent" data-id="${e.id}">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No events yet. Add the first one.</td></tr>'}</table></div>`;
  }else if(tab==='access'){
    body=`<div class="note">Brothers sign in with one shared chapter password. Change it whenever officers turn over or a brother leaves, and share the new one at the next meeting.</div>
    <form class="stack" id="accessForm">
      <label>Brothers password<input name="brotherPw" value="${esc(S.brotherPw)}" required minlength="6"></label>
      <label>Officer password<input name="officerPw" value="${esc(S.officerPw)}" required minlength="6"></label>
      <p class="err" id="accessErr"></p>
      <div><button class="btn btn-primary" type="submit">Update passwords</button></div></form>`;
  }else{
    body=`<form class="stack" id="contentForm">
      <label>Chapter name<input name="chapterName" value="${esc(S.chapterName)}" required></label>
      <label>Homepage tagline<textarea name="tagline" style="min-height:80px">${esc(S.tagline)}</textarea></label>
      <label>About the chapter<textarea name="about" style="min-height:160px">${esc(S.about)}</textarea></label>
      <label>Document storage<select name="driveProvider"><option ${S.driveProvider==='Google Drive'?'selected':''}>Google Drive</option><option ${S.driveProvider==='SharePoint'?'selected':''}>SharePoint</option></select></label>
      <fieldset style="border:1px solid var(--line);border-radius:10px;padding:16px"><legend style="font-weight:600;font-size:14px;padding:0 6px">Chapter leadership</legend>
      <div style="display:flex;flex-direction:column;gap:10px">${S.officers.map((o,i)=>`<div class="row2"><input aria-label="Office ${i+1}" name="or${i}" value="${esc(o[0])}"><input aria-label="Name for office ${i+1}" name="on${i}" value="${esc(o[1])}"></div>`).join('')}</div></fieldset>
      <div><button class="btn btn-primary" type="submit">Save changes</button></div></form>`;
  }
  $('#app').innerHTML=`<div class="wrap shell"><h1>Officer dashboard</h1><p class="sub" style="margin:0">Manage the site for ${esc(S.chapterName)}</p>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='aevents'}" data-tab="aevents">Events</button><button role="tab" aria-selected="${tab==='access'}" data-tab="access">Access</button><button role="tab" aria-selected="${tab==='content'}" data-tab="content">Page content</button></div>${body}</div>`;
  const af=$('#accessForm');
  if(af)af.addEventListener('submit',ev=>{ev.preventDefault(); const f=new FormData(af); const bp=f.get('brotherPw').trim(), op=f.get('officerPw').trim();
    if(bp===op){$('#accessErr').textContent='Use different passwords for brothers and officers.'; return;}
    S.brotherPw=bp; S.officerPw=op; save(); render(); toast('Passwords updated. Share the new brothers password with the chapter.');});
  const cf=$('#contentForm');
  if(cf)cf.addEventListener('submit',ev=>{ev.preventDefault(); const f=new FormData(cf);
    S.chapterName=f.get('chapterName').trim()||S.chapterName; S.tagline=f.get('tagline'); S.about=f.get('about'); S.driveProvider=f.get('driveProvider');
    S.officers=S.officers.map((o,i)=>[f.get('or'+i),f.get('on'+i)]); save(); render(); toast('Changes saved. The public site is updated.');});
}

function render(){renderChrome(); if(view==='home')renderHome(); else if(view==='portal')renderPortal(); else renderAdmin();}

/* modals */
function openModal(html){$('#modal').innerHTML='<button class="x" data-act="close" aria-label="Close">\u00d7</button>'+html; $('#overlay').classList.add('open'); const f=$('#modal').querySelector('input,select,textarea,button:not(.x)'); if(f)f.focus();}
function closeModal(){$('#overlay').classList.remove('open');}

function loginModal(){
  openModal(`<h2>Brothers</h2><p class="sub" style="margin:0 0 16px">Enter the chapter password to open the brothers portal.</p>
  <form class="stack" id="loginForm"><label>Password<input type="password" name="pw" required autocomplete="current-password"></label>
  <p class="err" id="loginErr"></p><button class="btn btn-primary" type="submit">Enter portal</button></form>
  <p style="font-size:14px;color:var(--muted);margin:18px 0 0">Demo passwords: brothers <strong>${esc(S.brotherPw)}</strong>, officers <strong>${esc(S.officerPw)}</strong></p>`);
  $('#loginForm').addEventListener('submit',ev=>{ev.preventDefault(); doLogin(new FormData(ev.target).get('pw'));});
}
function doLogin(pw){
  pw=String(pw||'');
  let role=null;
  if(pw===S.officerPw)role='admin'; else if(pw===S.brotherPw)role='member';
  if(!role){$('#loginErr').textContent='That password isn\u2019t right. Check with a chapter officer for the current one.'; return;}
  S.role=role; save(); closeModal(); view=role==='admin'?'admin':'portal'; tab=role==='admin'?'aevents':'docs'; openFolder=null; render(); window.scrollTo(0,0);
  toast(role==='admin'?'Signed in to the officer dashboard.':'Welcome to the brothers portal.');
}
function eventModal(e){
  const x=e||{title:'',date:iso(7),time:'18:00',location:'',desc:'',vis:'public',link:''};
  openModal(`<h2>${e?'Edit event':'Add event'}</h2>
  <form class="stack" id="evForm" style="margin-top:16px"><label>Event name<input name="title" required value="${esc(x.title)}"></label>
  <div class="row2"><label>Date<input type="date" name="date" required value="${esc(x.date)}"></label><label>Time<input type="time" name="time" value="${esc(x.time)}"></label></div>
  <label>Location<input name="location" required value="${esc(x.location)}"></label>
  <label>Description<textarea name="desc">${esc(x.desc)}</textarea></label>
  <div class="row2"><label>Shown to<select name="vis"><option value="public" ${x.vis==='public'?'selected':''}>Everyone</option><option value="members" ${x.vis==='members'?'selected':''}>Brothers only</option></select></label>
  <label>RSVP or ticket link<input name="link" value="${esc(x.link)}" placeholder="Optional"></label></div>
  <button class="btn btn-primary" type="submit">${e?'Save event':'Add event'}</button></form>`);
  $('#evForm').addEventListener('submit',ev=>{ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target));
    if(e)Object.assign(e,f); else S.events.push({id:Date.now(),...f}); save(); closeModal(); render(); toast(e?'Event saved.':'Event added. It\u2019s live now.');});
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-go],[data-tab]'); if(!t)return;
  if(t.dataset.go){ev.preventDefault(); view=t.dataset.go; tab=view==='admin'?'aevents':'docs'; openFolder=null; render(); window.scrollTo(0,0); return;}
  if(t.dataset.tab){tab=t.dataset.tab; openFolder=null; render(); return;}
  const a=t.dataset.act, id=Number(t.dataset.id);
  if(a==='login'){loginModal();}
  else if(a==='close'){closeModal();}
  else if(a==='logout'){S.role=null; save(); view='home'; render(); window.scrollTo(0,0); toast('Signed out.');}
  else if(a==='rsvp'){toast('In the live site, this opens the event\u2019s RSVP or ticket page.');}
  else if(a==='folder'){openFolder=Number(t.dataset.i); render();}
  else if(a==='back'){openFolder=null; render();}
  else if(a==='openfile'){toast('In the live site, this opens the file in '+S.driveProvider+'.');}
  else if(a==='newevent'){eventModal(null);}
  else if(a==='editevent'){eventModal(S.events.find(e=>e.id===id));}
  else if(a==='delevent'){const e=S.events.find(x=>x.id===id); if(e&&confirm('Delete \u201c'+e.title+'\u201d? This removes it from the site.')){S.events=S.events.filter(x=>x.id!==id); save(); render(); toast('Event deleted.');}}
});
$('#overlay').addEventListener('click',ev=>{if(ev.target.id==='overlay')closeModal();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();});
$('#resetBtn').addEventListener('click',()=>{S=seed(); save(); view='home'; tab='docs'; openFolder=null; render(); window.scrollTo(0,0); toast('Demo reset to sample data.');});
render();
</script>
</body>
</html>
