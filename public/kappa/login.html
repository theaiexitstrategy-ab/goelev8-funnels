<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Chapter Agent · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#8C1C2E; --crimson-deep:#6E1422; --accent:#8C1C2E; --cream:#F2EADB; --bg:#FBF7F0; --surface:#FFFFFF;
  --ink:#231A1B; --muted:#6B5E5C; --line:#E3D8C8; --on-crimson:#FBF1E6;
  --serif:'DM Serif Display', Georgia, serif; --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1A1314; --surface:#241B1C; --ink:#F2EADB; --muted:#BCAEA6; --line:#3B2F30; --accent:#E06A7D; --cream:#2C2122; } }
:root[data-theme="dark"]{ --bg:#1A1314; --surface:#241B1C; --ink:#F2EADB; --muted:#BCAEA6; --line:#3B2F30; --accent:#E06A7D; --cream:#2C2122; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55}
.top{background:var(--crimson); color:var(--on-crimson); padding:14px 20px; font-family:var(--serif); font-size:22px}
.top small{display:block; font-family:var(--sans); font-size:12px; opacity:.85}
main{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px}
.card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px}
h1{font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.1; margin:0 0 8px}
p{margin:0 0 20px; color:var(--muted)}
label{display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:14px}
input{font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-weight:400}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button{margin-top:16px; width:100%; font:inherit; font-weight:600; border:none; border-radius:8px; padding:12px; background:var(--crimson); color:var(--on-crimson); cursor:pointer}
button:hover{background:var(--crimson-deep)}
button[disabled]{opacity:.6; cursor:wait}
.err{color:var(--accent); font-size:14px; min-height:20px; margin:10px 0 0}
.hint{font-size:14px; margin:18px 0 0}
footer{padding:20px; font-size:14px; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="top">Lawton Chapter<small>Chapter Agent · demo</small></div>
<main>
  <form class="card" id="f">
    <h1>Officer sign-in</h1>
    <p>The Chapter Agent is for chapter officers. Enter the officer password to continue.</p>
    <label>Officer password<input type="password" name="password" required autocomplete="current-password" autofocus></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">Open Chapter Agent</button>
    <p class="hint"><a href="/kappa">Back to the chapter site</a></p>
  </form>
</main>
<footer><span>Sample data for a sales demo</span><span>Site by <a href="https://goelev8.ai" target="_blank" rel="noopener">GoElev8.ai</a></span></footer>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/kappa-agent/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: new FormData(ev.target).get('password') }),
    });
    if (res.ok) { location.replace('/kappa/agent'); return; }
    err.textContent = (await res.json().catch(() => ({}))).error || 'Sign-in failed. Try again.';
  } catch (e) { err.textContent = 'Network error. Try again.'; }
  btn.disabled = false;
});
</script>
</body>
</html>
